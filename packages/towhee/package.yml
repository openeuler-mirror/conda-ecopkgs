name: towhee
category: others
channel: conda-forge
description: Towhee is a flexible, application-oriented framework for computing embedding vectors over unstructured data.
license: Apache-2.0
homepage: https://github.com/towhee-io/towhee

maintainer: zhangxinyuehfad
maintainer-email: starmoon_zhang@163.com

usage: |

  - 添加Channel
    ```
    conda config --add channels conda-forge
    ```

  - 创建隔离环境(可选)
    ```
    conda create -n towhee
    conda activate towhee
    ```

  - 安装软件包
    ```
    conda install towhee
    ```

dependency-channels:
  - conda-forge

upstream:
  backend: GitHub
  version_scheme: RPM
  version_url: towhee-io/towhee
  version_filter: rc
