name: onnxruntime
category: others
channel: conda-forge
description: Cross-platform, high performance ML inferencing and training accelerator.
license: MIT
homepage: https://onnxruntime.ai

maintainer: zhangxinyuehfad
maintainer-email: starmoon_zhang@163.com

usage: |

  - 添加Channel
    ```
    conda config --add channels conda-forge
    ```

  - 创建隔离环境(可选)
    ```
    conda create -n onnxruntime
    conda activate onnxruntime
    ```

  - 安装软件包
    ```
    conda install onnxruntime
    ```

dependency-channels:
  - conda-forge

upstream:
  backend: GitHub
  version_scheme: RPM
  version_url: microsoft/onnxruntime
  version_prefix: v
  version_filter: rc
