name: taskflow
category: others
channel: conda-forge
description: Parallel and Heterogeneous Task Programming in Modern C++.
license: MIT
homepage: https://github.com/taskflow/taskflow

maintainer: zhangxinyuehfad
maintainer-email: starmoon_zhang@163.com

usage: |

  - 添加Channel
    ```
    conda config --add channels conda-forge
    ```

  - 创建隔离环境(可选)
    ```
    conda create -n taskflow
    conda activate taskflow
    ```

  - 安装软件包
    ```
    conda install taskflow
    ```

dependency-channels:
  - conda-forge

upstream:
  backend: GitHub
  version_scheme: RPM
  version_url: taskflow/taskflow
  version_prefix: v
  version_filter: rc
