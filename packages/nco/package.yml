name: nco
category: hpc
channel: conda-forge
description: Suite of programs for manipulating NetCDF/HDF4 files.
license: BSD-3-Clause
homepage: http://nco.sourceforge.net/

maintainer: zhangxinyuehfad
maintainer-email: starmoon_zhang@163.com

usage: |

  - 添加Channel
    ```
    conda config --add channels conda-forge
    ```

  - 创建隔离环境(可选)
    ```
    conda create -n nco
    conda activate nco
    ```

  - 安装软件包
    ```
    conda install nco
    ```

dependency-channels:
  - conda-forge

upstream:
  backend: GitHub
  version_scheme: RPM
  version_url: nco/nco
  version_filter: rc;alpha
