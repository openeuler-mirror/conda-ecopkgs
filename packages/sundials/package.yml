name: sundials
category: others
channel: conda-forge
description: SUite of Nonlinear and DIfferential/ALgebraic equation Solvers.
license: BSD-3-Clause
homepage: https://computing.llnl.gov/projects/sundials

maintainer: zhangxinyuehfad
maintainer-email: starmoon_zhang@163.com

usage: |

  - 添加Channel
    ```
    conda config --add channels conda-forge
    ```

  - 创建隔离环境(可选)
    ```
    conda create -n sundials
    conda activate sundials
    ```

  - 安装软件包
    ```
    conda install sundials
    ```

dependency-channels:
  - conda-forge

upstream:
  backend: GitHub
  version_scheme: RPM
  version_url: llnl/sundials
  version_prefix: v
  version_filter: rc
